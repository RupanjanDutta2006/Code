<!doctype html>
<html lang="en" class="dark" style="background-color: #060608; color: #f3f4f6;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e11d48' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m18 16 4-4-4-4'/><path d='m6 8-4 4 4 4'/><path d='m14.5 4-5 16'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>CodeVault Pro — Next-Gen AI Code Platform & Interactive Learning Studio</title>
    <meta name="description" content="Your personal code library, multi-language compiler, competitive programming judge, and classroom platform." />
    <meta name="theme-color" content="#060608" />
    <meta name="color-scheme" content="dark light" />

    <!-- Google Fonts Preconnect & Non-blocking Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>

    <link rel="manifest" href="/manifest.json" />

    <!-- Critical CSS: Guarantee Instant Dark Surface Before React Mounts (Zero White Flash) -->
    <style>
      html, body, #root {
        background-color: #060608 !important;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes cvPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes cvBar {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 40%; }
      }
      .cv-pre-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #060608;
        color: #f3f4f6;
        text-align: center;
        user-select: none;
        padding: 16px;
        box-sizing: border-box;
      }
      .cv-pre-logo {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(135deg, #e11d48 0%, #881337 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 35px rgba(225, 29, 72, 0.45);
        animation: cvPulse 2.2s infinite ease-in-out;
        margin-bottom: 16px;
      }
      .cv-pre-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin: 0 0 6px 0;
        color: #ffffff;
      }
      .cv-pre-title span {
        color: #ff334b;
        font-family: monospace;
      }
      .cv-pre-sub {
        font-size: 12px;
        color: #9ca3af;
        margin: 0 0 20px 0;
        font-weight: 500;
      }
      .cv-pre-track {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .cv-pre-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        background: linear-gradient(90deg, #e11d48, #ff4d5a, #e11d48);
        border-radius: 999px;
        animation: cvBar 1.4s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-[#060608] text-slate-100 min-h-screen antialiased selection:bg-crimson-500 selection:text-white" style="margin: 0; background-color: #060608; color: #f3f4f6;">
    <div id="root">
      <!-- Instant CodeVault Pre-Mount Visual Shell (Replaced by React on mount) -->
      <div class="cv-pre-shell" id="cv-pre-shell">
        <div class="cv-pre-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="cv-pre-title">CodeVault <span>Pro</span></div>
        <div class="cv-pre-sub">Loading workspace...</div>
        <div class="cv-pre-track">
          <div class="cv-pre-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
